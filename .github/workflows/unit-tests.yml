name: Unit and CLI tests

on:
  push:
    branches: [main, 'beta*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: dave unit and CLI tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.17.1
        env:
          ZIG_VERSION: 0.17.1
          # SHA-256 from https://ziglang.org/download/index.json.
          ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            --output "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xf "$archive" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/zig/zig" version)" = "$ZIG_VERSION"

      # neomake runs the tests (neomake.tomlx): theJoeLinuxFoundation/neomake
      # at a pinned commit, built once and cached.
      - name: Cache neomake
        id: neomake-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/neomake
          key: neomake-b5802337db92379f0149e0087447adfc8ed4dd05

      - name: Install neomake
        if: steps.neomake-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/theJoeLinuxFoundation/neomake \
            --rev b5802337db92379f0149e0087447adfc8ed4dd05 neomake

      - name: Install CLI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y btrfs-progs bubblewrap cpio dosfstools fdisk mtools squashfs-tools xorriso zstd
          # The CLI tests build images and enter temporary roots in a user namespace.
          if ! unshare --map-root-user true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run unit and CLI tests
        run: neomake test unit 'cli-*' --junit build/junit.xml
